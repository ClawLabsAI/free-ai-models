name: Weekly release

# Watchers are not notified about the daily data commits; they are notified
# about releases. One a week, after Monday's data update (04:00 UTC).
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node scripts/weekly-release.js
      - name: Publish (skipped if this week's release already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(cat release-tag.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --title "$(cat release-title.txt)" --notes-file release-notes.md --latest
