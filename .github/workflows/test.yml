name: Test

on:
  push:
    branches: [main]
    paths: ["scoring/**", "scripts/**", "test/**", "package.json", "package-lock.json"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
